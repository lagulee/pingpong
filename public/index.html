<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1vs1 탁구</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10141c; overflow: hidden; }
    #game { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 12px; left: 16px;
      color: #e8eef7; font: 600 15px/1.4 system-ui, sans-serif;
      text-shadow: 0 1px 3px #000; pointer-events: none;
    }
    #error { color: #ff8a80; }
    /* 마지막 구질 판정 (손으로 확인할 때 보는 글자) */
    #shot { margin-top: 6px; font: 800 30px/1.1 system-ui, sans-serif; letter-spacing: 0.02em; min-height: 33px; }
    #shot.shot-perfect { color: #ffd84d; }
    #shot.shot-good { color: #8fe39a; }
    #shot.shot-ok { color: #9fc3ff; }
    #shot.shot-bad { color: #ff8a80; }
    #shot-sub { font-weight: 500; font-size: 13px; color: #c9d3e0; min-height: 18px; }
    #robot-shot { font-weight: 500; font-size: 13px; color: #9fb0c8; min-height: 18px; }
    #center {
      position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%);
      color: #fff; font: 700 26px/1.3 system-ui, sans-serif; text-shadow: 0 2px 6px #000;
      pointer-events: none; text-align: center; white-space: pre-line;
    }
    #center.center-win { color: #8fe39a; }
    #center.center-lose { color: #ff8a80; }
    #center.center-neutral { color: #ffd84d; }
    #game { cursor: crosshair; }
    /* 점수판 (화면 위 가운데) */
    #scoreboard {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      display: grid; grid-template-columns: auto auto auto auto auto; align-items: center; column-gap: 10px;
      padding: 6px 16px; border-radius: 10px; background: rgba(10, 14, 22, 0.72);
      color: #e8eef7; font: 600 16px/1.2 system-ui, sans-serif; pointer-events: none; text-align: center;
    }
    #scoreboard .pts { font: 800 34px/1 system-ui, sans-serif; min-width: 1.4em; font-variant-numeric: tabular-nums; }
    #scoreboard .sep { font: 800 28px/1 system-ui, sans-serif; color: #9fb0c8; }
    #scoreboard .me { color: #ff9a8f; }
    #scoreboard .robot { color: #9fb6ff; }
    #scoreboard .serve { color: #ffd84d; font-size: 13px; }
    #serve-info { grid-column: 1 / 6; font: 500 12px/1.4 system-ui, sans-serif; color: #c9d3e0; margin-top: 2px; }
    /* 결과 화면 */
    #result {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(6, 9, 14, 0.6);
    }
    #result[hidden] { display: none; }
    #result .box {
      min-width: 280px; padding: 24px 32px; border-radius: 14px; background: #161d2b; text-align: center;
      color: #e8eef7; font: 500 16px/1.5 system-ui, sans-serif; box-shadow: 0 8px 30px #000a;
    }
    #result-title { margin: 0 0 6px; font: 800 40px/1.1 system-ui, sans-serif; }
    #result-title.result-win { color: #ffd84d; }
    #result-title.result-lose { color: #ff8a80; }
    #again {
      margin-top: 16px; padding: 10px 26px; border: 0; border-radius: 8px; background: #2f6bd8; color: #fff;
      font: 700 17px/1 system-ui, sans-serif; cursor: pointer;
    }
    #again:hover { background: #3d7cf0; }
    /* 버전 표시 (배포 반영 확인용) */
    #version {
      position: fixed; left: 10px; bottom: 8px; color: rgba(232, 238, 247, 0.55);
      font: 12px/1 ui-monospace, monospace; pointer-events: none;
    }
    /* 시작 화면: 클릭으로 오디오 켜기 */
    #start {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(6, 9, 14, 0.7); cursor: pointer; z-index: 20;
    }
    #start[hidden] { display: none; }
    #start .box { text-align: center; color: #e8eef7; font: 500 16px/1.6 system-ui, sans-serif; }
    #start h1 { margin: 0 0 8px; font: 900 52px/1.1 system-ui, sans-serif; letter-spacing: 0.02em; }
    #start .go {
      display: inline-block; margin-top: 18px; padding: 12px 30px; border-radius: 10px; background: #2f6bd8;
      color: #fff; font: 800 20px/1 system-ui, sans-serif;
    }
    #start:hover .go { background: #3d7cf0; }
    /* 음소거·음량 (왼쪽 아래, 버전 위) */
    #audio-ui {
      position: fixed; left: 8px; bottom: 26px; display: flex; align-items: center; gap: 6px;
      padding: 4px 8px; border-radius: 8px; background: rgba(10, 14, 22, 0.55); z-index: 10;
    }
    /* 일시정지 화면 */
    #pause {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(6, 9, 14, 0.6); cursor: pointer; z-index: 18;
    }
    #pause[hidden] { display: none; }
    #pause .box { text-align: center; color: #e8eef7; font: 500 16px/1.7 system-ui, sans-serif; }
    #pause h1 { margin: 0 0 8px; font: 900 48px/1.1 system-ui, sans-serif; letter-spacing: 0.04em; }
    #pause .go {
      display: inline-block; margin-top: 16px; padding: 10px 28px; border-radius: 10px; background: #2f6bd8;
      color: #fff; font: 800 18px/1 system-ui, sans-serif;
    }
    #pause:hover .go { background: #3d7cf0; }
    #pause-btn, #mute { border: 0; background: none; color: #e8eef7; font-size: 20px; line-height: 1; cursor: pointer; padding: 0 2px; }
    #volume { width: 90px; }
    /* 판정 팝업: 공 위치에서 튀어 올랐다 사라짐 */
    #popups { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .popup {
      position: absolute; transform: translate(-50%, -50%); font-family: system-ui, sans-serif; font-weight: 900;
      letter-spacing: 0.04em; text-shadow: 0 0 10px currentColor, 0 2px 4px #000; white-space: nowrap;
      animation-name: popup-rise; animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1); animation-fill-mode: forwards;
    }
    @keyframes popup-rise {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
      15% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
      30% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, calc(-50% + var(--rise))) scale(1); opacity: 0; }
    }
    /* 사운드 테스트 (?sound=1) */
    #soundtest {
      position: fixed; left: 8px; top: 50%; transform: translateY(-50%); max-height: 80vh; overflow-y: auto;
      padding: 8px 12px; border-radius: 10px; background: rgba(12, 16, 24, 0.9); color: #dfe7f2;
      font: 12px/1.35 system-ui, sans-serif; z-index: 15;
    }
    #soundtest h3 { margin: 2px 0 6px; font-size: 13px; color: #9fc3ff; }
    #soundtest .st-row { display: grid; grid-template-columns: 96px repeat(4, auto); gap: 4px; align-items: center; margin: 3px 0; }
    #soundtest button {
      background: #26324a; color: #e8eef7; border: 1px solid #3d4d6e; border-radius: 4px;
      padding: 3px 8px; font: inherit; cursor: pointer;
    }
    #soundtest button:hover { background: #33446a; }
    #soundtest .st-info { margin: 8px 0 0; max-width: 340px; white-space: pre-wrap; font: 11px/1.4 ui-monospace, monospace; color: #c9d3e0; }
    /* 디버그 패널 (?debug=1) */
    #debug {
      position: fixed; top: 0; right: 0; width: 300px; max-height: 100vh; overflow-y: auto;
      box-sizing: border-box; padding: 8px 12px 16px;
      background: rgba(12, 16, 24, 0.88); color: #dfe7f2;
      font: 12px/1.35 system-ui, sans-serif;
    }
    #debug h3 { margin: 10px 0 4px; font-size: 13px; color: #9fc3ff; }
    #debug .dbg-row { display: grid; grid-template-columns: 1fr auto; column-gap: 6px; margin: 3px 0; }
    #debug .dbg-row input { grid-column: 1 / 3; width: 100%; margin: 0; }
    #debug .dbg-val { font-variant-numeric: tabular-nums; color: #ffd27a; }
    #debug .dbg-buttons { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; align-items: center; }
    #debug button {
      background: #26324a; color: #e8eef7; border: 1px solid #3d4d6e; border-radius: 4px;
      padding: 3px 8px; font: inherit; cursor: pointer;
    }
    #debug button:hover { background: #33446a; }
    #debug .dbg-fire { background: #2f6b3a; border-color: #4a9a5a; }
    #debug .dbg-msg { color: #8fe39a; }
    #debug .dbg-info { margin: 3px 0; font-variant-numeric: tabular-nums; }
    #debug .dbg-log { white-space: pre; font: 11px/1.4 ui-monospace, monospace; color: #c9d3e0; overflow-x: auto; }
    #debug .dbg-group { margin: 4px 0; border-left: 2px solid #33446a; padding-left: 6px; }
    #debug .dbg-group summary { cursor: pointer; color: #cfe0ff; margin: 2px 0; }
    #debug .dbg-toggle { display: flex; gap: 6px; align-items: center; margin: 5px 0 2px; color: #ffd27a; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div>1vs1 탁구</div>
    <div id="status">불러오는 중…</div>
    <div id="error"></div>
    <div id="shot"></div>
    <div id="shot-sub"></div>
    <div id="robot-shot"></div>
  </div>
  <div id="scoreboard">
    <span class="name me">나 <span id="serve-me" class="serve">● 서브</span></span>
    <span id="score-me" class="pts me">0</span>
    <span class="sep">:</span>
    <span id="score-robot" class="pts robot">0</span>
    <span class="name robot"><span id="serve-robot" class="serve">서브 ●</span> 로봇</span>
    <div id="serve-info"></div>
  </div>
  <div id="center"></div>
  <div id="result" hidden>
    <div class="box">
      <h2 id="result-title"></h2>
      <div id="result-score"></div>
      <button id="again" type="button">다시 하기</button>
    </div>
  </div>
  <div id="popups"></div>
  <div id="audio-ui">
    <button id="pause-btn" type="button" title="일시정지 (P)">⏸</button>
    <button id="mute" type="button">🔊</button>
    <input id="volume" type="range" min="0" max="1" step="0.01" title="음량">
  </div>
  <div id="version"></div>
  <div id="pause" hidden>
    <div class="box">
      <h1>일시정지</h1>
      <div>P · Esc 또는 클릭하면 이어서 합니다.</div>
      <div>탭을 옮기면 자동으로 멈춥니다.</div>
      <div class="go">계속하기</div>
    </div>
  </div>
  <div id="start">
    <div class="box">
      <h1>1vs1 탁구</h1>
      <div>클릭하면 소리가 켜지고 경기가 시작됩니다.</div>
      <div>드래그로 치기 · P 일시정지 · M 음소거</div>
      <div class="go">클릭해서 시작</div>
    </div>
  </div>
  <script>
    // 모듈 로드 실패(CDN 차단, WebGL 미지원 등)를 화면에 알린다.
    window.addEventListener('error', (e) => {
      document.getElementById('error').textContent = '오류: ' + (e.message || '스크립트를 불러오지 못했습니다.');
    });
    // 모듈 의존성(Three.js CDN) 로드 실패는 error 이벤트로 잡히지 않으므로 시간 초과로 안내한다.
    setTimeout(() => {
      if (document.getElementById('status').textContent === '불러오는 중…') {
        document.getElementById('error').textContent = '3D 엔진을 불러오지 못했습니다. 새로고침해 주세요.';
      }
    }, 10000);
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
