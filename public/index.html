<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>1vs1 탁구</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10141c; overflow: hidden; }
    #game { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 12px; left: 16px;
      color: #e8eef7; font: 600 15px/1.4 system-ui, sans-serif;
      text-shadow: 0 1px 3px #000; pointer-events: none;
    }
    #error { color: #ff8a80; }
    /* 마지막 구질 판정 (손으로 확인할 때 보는 글자) */
    #shot { margin-top: 6px; font: 800 30px/1.1 system-ui, sans-serif; letter-spacing: 0.02em; min-height: 33px; }
    #shot.shot-perfect { color: #ffd84d; }
    #shot.shot-good { color: #8fe39a; }
    #shot.shot-ok { color: #9fc3ff; }
    #shot.shot-bad { color: #ff8a80; }
    #shot-sub { font-weight: 500; font-size: 13px; color: #c9d3e0; min-height: 18px; }
    #robot-shot { font-weight: 500; font-size: 13px; color: #9fb0c8; min-height: 18px; }
    #center {
      position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%);
      color: #fff; font: 700 26px/1.3 system-ui, sans-serif; text-shadow: 0 2px 6px #000;
      pointer-events: none; text-align: center; white-space: pre-line;
    }
    #center.center-win { color: #8fe39a; }
    #center.center-lose { color: #ff8a80; }
    #center.center-neutral { color: #ffd84d; }
    #game { cursor: crosshair; touch-action: none; } /* 터치: 스크롤·확대 대신 라켓 조작 */
    /* 점수판 (화면 위 가운데) */
    #scoreboard {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      display: grid; grid-template-columns: auto auto auto auto auto; align-items: center; column-gap: 10px;
      padding: 6px 16px; border-radius: 10px; background: rgba(10, 14, 22, 0.72);
      color: #e8eef7; font: 600 16px/1.2 system-ui, sans-serif; pointer-events: none; text-align: center;
    }
    #scoreboard .pts { font: 800 34px/1 system-ui, sans-serif; min-width: 1.4em; font-variant-numeric: tabular-nums; }
    #scoreboard .sep { font: 800 28px/1 system-ui, sans-serif; color: #9fb0c8; }
    #scoreboard .me { color: #ff9a8f; }
    #scoreboard .robot { color: #9fb6ff; }
    #scoreboard .serve { color: #ffd84d; font-size: 13px; }
    #serve-info { grid-column: 1 / 6; font: 500 12px/1.4 system-ui, sans-serif; color: #c9d3e0; margin-top: 2px; }
    /* 결과 화면 */
    #result {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(6, 9, 14, 0.6);
    }
    #result[hidden] { display: none; }
    #result .box {
      min-width: 280px; padding: 24px 32px; border-radius: 14px; background: #161d2b; text-align: center;
      color: #e8eef7; font: 500 16px/1.5 system-ui, sans-serif; box-shadow: 0 8px 30px #000a;
    }
    #result-title { margin: 0 0 6px; font: 800 40px/1.1 system-ui, sans-serif; }
    #result-title.result-win { color: #ffd84d; }
    #result-title.result-lose { color: #ff8a80; }
    #again {
      margin-top: 16px; padding: 10px 26px; border: 0; border-radius: 8px; background: #2f6bd8; color: #fff;
      font: 700 17px/1 system-ui, sans-serif; cursor: pointer;
    }
    #again:hover { background: #3d7cf0; }
    /* 버전 표시 (배포 반영 확인용) */
    #version {
      position: fixed; left: 10px; bottom: 8px; color: rgba(232, 238, 247, 0.55);
      font: 12px/1 ui-monospace, monospace; pointer-events: none;
    }
    /* 첫 화면 (연습 / 방 만들기 / 코드로 입장). 클릭하면 오디오도 켠다 */
    .overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(6, 9, 14, 0.72); z-index: 20;
    }
    .overlay[hidden] { display: none; }
    .overlay .box {
      min-width: 300px; max-width: 420px; padding: 24px 30px; border-radius: 14px; background: #161d2b;
      text-align: center; color: #e8eef7; font: 500 15px/1.6 system-ui, sans-serif; box-shadow: 0 8px 30px #000a;
    }
    .overlay h1 { margin: 0 0 8px; font: 900 44px/1.1 system-ui, sans-serif; letter-spacing: 0.02em; }
    .overlay .row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
    .overlay input[type=text] {
      padding: 9px 12px; border-radius: 8px; border: 1px solid #3d4d6e; background: #0f1520; color: #e8eef7;
      font: 600 16px/1 system-ui, sans-serif; width: 150px; text-align: center;
    }
    .overlay button {
      padding: 10px 18px; border: 0; border-radius: 8px; background: #2f6bd8; color: #fff;
      font: 700 16px/1 system-ui, sans-serif; cursor: pointer;
    }
    .overlay button:hover { background: #3d7cf0; }
    .overlay button.sub { background: #33446a; }
    .overlay button.sub:hover { background: #43568a; }
    .overlay .hint { color: #9fb0c8; font-size: 13px; }
    .overlay .err { color: #ff8a80; min-height: 22px; margin-top: 10px; font-weight: 600; }
    #menu-code { width: 90px; text-transform: uppercase; letter-spacing: 0.15em; }
    #lobby-code { font: 900 52px/1.1 ui-monospace, monospace; letter-spacing: 0.18em; color: #ffd84d; margin: 4px 0; }
    #lobby-players { margin: 10px 0 4px; text-align: left; display: inline-block; }
    #lobby-status { color: #c9d3e0; min-height: 22px; }
    /* 대전: 핑 (오른쪽 위), 연결 안내, 나가기 */
    #ping {
      position: fixed; top: 12px; right: 16px; padding: 4px 10px; border-radius: 8px; background: rgba(10, 14, 22, 0.6);
      font: 700 14px/1.2 ui-monospace, monospace; pointer-events: none;
    }
    #ping[hidden] { display: none; }
    #ping.good { color: #8fe39a; }
    #ping.ok { color: #ffd84d; }
    #ping.bad { color: #ff8a80; }
    #net-msg {
      position: fixed; left: 50%; top: 22%; transform: translateX(-50%); padding: 8px 18px; border-radius: 10px;
      background: rgba(60, 20, 20, 0.85); color: #ffd6d0; font: 700 18px/1.4 system-ui, sans-serif; pointer-events: none; z-index: 12;
    }
    #net-msg[hidden] { display: none; }
    #center.center-tentative { color: #b8c2d0; }
    #center.center-corrected { color: #ffd84d; }
    #leave-btn { position: fixed; top: 44px; right: 16px; z-index: 10; }
    #leave-btn[hidden] { display: none; }
    body:has(#debug:not(.collapsed)) #ping, body:has(#debug:not(.collapsed)) #leave-btn { right: 316px; }
    #leave-btn {
      padding: 6px 14px; border: 0; border-radius: 8px; background: #33446a; color: #e8eef7;
      font: 700 13px/1 system-ui, sans-serif; cursor: pointer;
    }
    /* 음소거·음량 (왼쪽 아래, 버전 위) */
    #audio-ui {
      position: fixed; left: 8px; bottom: 26px; display: flex; align-items: center; gap: 6px;
      padding: 4px 8px; border-radius: 8px; background: rgba(10, 14, 22, 0.55); z-index: 10;
    }
    /* 일시정지 화면 */
    #pause {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(6, 9, 14, 0.6); cursor: pointer; z-index: 18;
    }
    #pause[hidden] { display: none; }
    #pause .box { text-align: center; color: #e8eef7; font: 500 16px/1.7 system-ui, sans-serif; }
    #pause h1 { margin: 0 0 8px; font: 900 48px/1.1 system-ui, sans-serif; letter-spacing: 0.04em; }
    #pause .go {
      display: inline-block; margin-top: 16px; padding: 10px 28px; border-radius: 10px; background: #2f6bd8;
      color: #fff; font: 800 18px/1 system-ui, sans-serif;
    }
    #pause:hover .go { background: #3d7cf0; }
    /* 일시정지 화면의 메인화면 버튼·조작표 (7단계) */
    #pause-menu {
      margin-top: 12px; padding: 9px 20px; border: 0; border-radius: 8px; background: #33446a; color: #e8eef7;
      font: 700 15px/1 system-ui, sans-serif; cursor: pointer;
    }
    #pause-menu:hover { background: #43568a; }
    #pause-menu[hidden] { display: none; }
    .controls { margin: 10px auto 0; border-collapse: collapse; font: 500 14px/1.5 system-ui, sans-serif; text-align: left; }
    .controls td { padding: 1px 8px; }
    .controls td:first-child { text-align: right; white-space: nowrap; }
    .controls kbd {
      display: inline-block; min-width: 1.4em; padding: 0 5px; border-radius: 4px; background: #2a3550; color: #fff;
      font: 700 13px/1.5 ui-monospace, monospace; text-align: center;
    }
    .controls .k-drive { color: #ff7a70; } .controls .k-cut { color: #7fb0ff; } .controls .k-side { color: #c48bff; } .controls .k-smash { color: #ffb04a; }
    .controls .note { color: #9fb0c8; font-size: 13px; padding-top: 4px; }
    #intro .box { max-width: 460px; }
    #intro label { display: block; margin-top: 10px; color: #9fb0c8; font-size: 13px; }
    /* 구질 버튼: PC 키 표시(아래 가운데)와 모바일 화면 버튼 (7단계) */
    #shot-keys {
      position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: none;
      font: 700 13px/1 system-ui, sans-serif; color: #e8eef7;
    }
    #shot-keys[hidden], #shot-btns[hidden], #spin-badge[hidden] { display: none; }
    #shot-keys span { padding: 6px 10px; border-radius: 8px; background: rgba(10, 14, 22, 0.55); border: 2px solid transparent; opacity: 0.6; }
    #shot-keys span.on, #shot-btns button.on { opacity: 1; border-color: currentColor; background: rgba(40, 52, 80, 0.9); }
    .c-drive { color: #ff7a70; } .c-cut { color: #7fb0ff; } .c-side { color: #c48bff; } .c-smash { color: #ffb04a; } .c-normal { color: #e8eef7; }
    #shot-btns {
      position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); left: calc(56px + env(safe-area-inset-left));
      display: grid; grid-template-columns: repeat(3, var(--btn, 64px)); gap: 8px; z-index: 11; touch-action: none;
    }
    #shot-btns.right { left: auto; right: calc(14px + env(safe-area-inset-right)); }
    #shot-btns button {
      width: var(--btn, 64px); height: var(--btn, 64px); border-radius: 14px; border: 2px solid transparent;
      background: rgba(10, 14, 22, 0.6); font: 800 14px/1.1 system-ui, sans-serif; opacity: 0.8; touch-action: none;
      -webkit-user-select: none; user-select: none; padding: 0;
    }
    /* 들어오는 공의 회전 표지 (내 예측 정점 고리 위) */
    #spin-badge {
      position: fixed; transform: translate(-50%, -100%); padding: 2px 8px; border-radius: 8px; background: rgba(10, 14, 22, 0.7);
      font: 800 15px/1.3 system-ui, sans-serif; pointer-events: none; white-space: nowrap; z-index: 5;
    }
    #pause-btn, #mute { border: 0; background: none; color: #e8eef7; font-size: 20px; line-height: 1; cursor: pointer; padding: 0 2px; }
    #volume { width: 90px; }
    /* 판정 팝업: 공 위치에서 튀어 올랐다 사라짐 */
    #popups { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .popup {
      position: absolute; transform: translate(-50%, -50%); font-family: system-ui, sans-serif; font-weight: 900;
      letter-spacing: 0.04em; text-shadow: 0 0 10px currentColor, 0 2px 4px #000; white-space: nowrap;
      animation-name: popup-rise; animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1); animation-fill-mode: forwards;
    }
    @keyframes popup-rise {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
      15% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
      30% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, calc(-50% + var(--rise))) scale(1); opacity: 0; }
    }
    /* 사운드 테스트 (?sound=1) */
    #soundtest {
      position: fixed; left: 8px; top: 50%; transform: translateY(-50%); max-height: 80vh; overflow-y: auto;
      padding: 8px 12px; border-radius: 10px; background: rgba(12, 16, 24, 0.9); color: #dfe7f2;
      font: 12px/1.35 system-ui, sans-serif; z-index: 15;
    }
    #soundtest h3 { margin: 2px 0 6px; font-size: 13px; color: #9fc3ff; }
    #soundtest .st-row { display: grid; grid-template-columns: 96px repeat(4, auto); gap: 4px; align-items: center; margin: 3px 0; }
    #soundtest button {
      background: #26324a; color: #e8eef7; border: 1px solid #3d4d6e; border-radius: 4px;
      padding: 3px 8px; font: inherit; cursor: pointer;
    }
    #soundtest button:hover { background: #33446a; }
    #soundtest .st-info { margin: 8px 0 0; max-width: 340px; white-space: pre-wrap; font: 11px/1.4 ui-monospace, monospace; color: #c9d3e0; }
    /* 디버그 패널 (?debug=1) */
    #debug {
      position: fixed; top: 0; right: 0; width: 300px; max-height: 100vh; overflow-y: auto;
      box-sizing: border-box; padding: 8px 12px 16px;
      background: rgba(12, 16, 24, 0.88); color: #dfe7f2;
      font: 12px/1.35 system-ui, sans-serif;
    }
    #debug h3 { margin: 10px 0 4px; font-size: 13px; color: #9fc3ff; }
    #debug .dbg-row { display: grid; grid-template-columns: 1fr auto; column-gap: 6px; margin: 3px 0; }
    #debug .dbg-row input { grid-column: 1 / 3; width: 100%; margin: 0; }
    #debug .dbg-val { font-variant-numeric: tabular-nums; color: #ffd27a; }
    #debug .dbg-buttons { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; align-items: center; }
    #debug button {
      background: #26324a; color: #e8eef7; border: 1px solid #3d4d6e; border-radius: 4px;
      padding: 3px 8px; font: inherit; cursor: pointer;
    }
    #debug button:hover { background: #33446a; }
    #debug .dbg-fire { background: #2f6b3a; border-color: #4a9a5a; }
    #debug .dbg-msg { color: #8fe39a; }
    #debug .dbg-info { margin: 3px 0; font-variant-numeric: tabular-nums; }
    #debug .dbg-log { white-space: pre; font: 11px/1.4 ui-monospace, monospace; color: #c9d3e0; overflow-x: auto; }
    #debug .dbg-group { margin: 4px 0; border-left: 2px solid #33446a; padding-left: 6px; }
    #debug .dbg-group summary { cursor: pointer; color: #cfe0ff; margin: 2px 0; }
    #debug .dbg-toggle { display: flex; gap: 6px; align-items: center; margin: 5px 0 2px; color: #ffd27a; }
    #debug .dbg-lock { margin: 4px 0; padding: 4px 6px; border-radius: 4px; background: #4a2a2a; color: #ffd6d0; }
    #debug [disabled] { opacity: 0.45; }
    #debug .dbg-head { display: flex; justify-content: flex-end; }
    #debug.collapsed { width: auto; padding: 4px; background: none; overflow: visible; }
    #debug.collapsed > :not(.dbg-head) { display: none; }
    /* 세로 화면 안내 (모바일) */
    #rotate {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 50;
      background: rgba(6, 9, 14, 0.92); color: #e8eef7; font: 800 22px/1.5 system-ui, sans-serif; text-align: center;
    }
    #rotate .icon { font-size: 54px; }
    .mob-only { display: none !important; }

    /* ── 모바일 모드 (6단계): body.mobile. 손가락 크기(44 px 이상) 버튼, 노치 여백, 스크롤·확대·길게 누르기 막기 ── */
    body.mobile {
      touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
    }
    body.mobile input { -webkit-user-select: text; user-select: text; touch-action: manipulation; }
    body.mobile .mob-only { display: inline-flex !important; }
    @media (orientation: portrait) { body.mobile #rotate { display: flex; } }
    body.mobile #hud { top: calc(4px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left)); font-size: 12px; }
    body.mobile #hud .hud-title { display: none; }
    body.mobile #shot { font-size: 20px; min-height: 22px; margin-top: 2px; }
    body.mobile #shot-sub, body.mobile #robot-shot { font-size: 11px; min-height: 14px; max-width: 34vw; }
    body.mobile #scoreboard { top: calc(4px + env(safe-area-inset-top)); padding: 3px 10px; column-gap: 6px; font-size: 12px; }
    body.mobile #scoreboard .pts { font-size: 24px; }
    body.mobile #scoreboard .sep { font-size: 20px; }
    body.mobile #scoreboard .serve { font-size: 10px; }
    body.mobile #serve-info { font-size: 10px; }
    body.mobile #center { font-size: 17px; top: 40%; }
    body.mobile #audio-ui {
      left: auto; bottom: auto; right: calc(6px + env(safe-area-inset-right)); top: calc(4px + env(safe-area-inset-top));
      gap: 2px; padding: 2px;
    }
    body.mobile #audio-ui button {
      min-width: 44px; min-height: 44px; align-items: center; justify-content: center; font-size: 22px; padding: 0;
    }
    body.mobile #audio-ui button[hidden] { display: none !important; }
    body.mobile #volume { display: none; }
    body.mobile #ping { top: calc(54px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); font-size: 11px; padding: 2px 6px; }
    body.mobile #leave-btn { top: calc(80px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); min-height: 40px; }
    body.mobile #net-msg { font-size: 14px; top: 30%; }
    body.mobile #version { left: calc(10px + env(safe-area-inset-left)); bottom: calc(6px + env(safe-area-inset-bottom)); }
    body.mobile .overlay .box { padding: 12px 18px; max-height: 94vh; overflow-y: auto; box-sizing: border-box; }
    body.mobile .overlay h1 { font-size: 28px; }
    body.mobile .overlay button, body.mobile .overlay input[type=text] { min-height: 44px; }
    body.mobile #lobby-code { font-size: 36px; }
    body.mobile #pause h1 { font-size: 30px; }
    body.mobile #pause-actions { gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
    body.mobile #pause-actions button {
      min-height: 44px; min-width: 64px; padding: 0 12px; border: 0; border-radius: 8px; background: #33446a;
      color: #e8eef7; font: 700 15px/1 system-ui, sans-serif;
    }
    body.mobile #result .box { padding: 14px 20px; }
    body.mobile #result-title { font-size: 28px; }
    body.mobile #debug { left: 0; right: auto; width: min(320px, 60vw); font-size: 11px; padding-left: calc(8px + env(safe-area-inset-left)); }
    body.mobile #debug.collapsed {
      width: auto; top: auto; bottom: calc(24px + env(safe-area-inset-bottom)); left: calc(4px + env(safe-area-inset-left)); padding: 0;
    }
    body.mobile #debug button { min-height: 32px; }
    body.mobile #debug .dbg-head button { min-height: 40px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-title">1vs1 탁구</div>
    <div id="status">불러오는 중…</div>
    <div id="error"></div>
    <div id="shot"></div>
    <div id="shot-sub"></div>
    <div id="robot-shot"></div>
  </div>
  <div id="scoreboard">
    <span class="name me"><span id="name-me">나</span> <span id="serve-me" class="serve">● 서브</span></span>
    <span id="score-me" class="pts me">0</span>
    <span class="sep">:</span>
    <span id="score-robot" class="pts robot">0</span>
    <span class="name robot"><span id="serve-robot" class="serve">서브 ●</span> <span id="name-robot">로봇</span></span>
    <div id="serve-info"></div>
  </div>
  <div id="center"></div>
  <div id="result" hidden>
    <div class="box">
      <h2 id="result-title"></h2>
      <div id="result-score"></div>
      <button id="again" type="button">다시 하기</button>
    </div>
  </div>
  <div id="popups"></div>
  <div id="audio-ui">
    <button id="pause-btn" type="button" title="일시정지 (P)">⏸</button>
    <button id="mute" type="button">🔊</button>
    <input id="volume" type="range" min="0" max="1" step="0.01" title="음량">
    <button id="view-btn" class="mob-only" type="button" title="시점 바꾸기 (Space)">👁</button>
    <button id="guide-btn" class="mob-only" type="button" title="서브 가이드 (G)">🎯</button>
    <button id="fs-btn" class="mob-only" type="button" title="전체 화면">⛶</button>
  </div>
  <div id="version"></div>
  <div id="pause" hidden>
    <div class="box">
      <h1>일시정지</h1>
      <div id="pause-hint">P · Esc 또는 클릭하면 이어서 합니다.</div>
      <div id="pause-hint2">탭을 옮기면 자동으로 멈춥니다.</div>
      <div id="pause-actions" class="mob-only">
        <button type="button" data-diff="EASY">쉬움</button>
        <button type="button" data-diff="NORMAL">보통</button>
        <button type="button" data-diff="HARD">어려움</button>
        <button id="pause-new" type="button">새 게임</button>
        <button id="pause-arrows" type="button">화살표</button>
      </div>
      <table id="pause-controls" class="controls"></table>
      <div class="go">계속하기</div>
      <div><button id="pause-menu" type="button">메인화면으로</button></div>
    </div>
  </div>
  <div id="shot-keys" hidden>
    <span data-k="drive" class="c-drive">Q 드라이브</span><span data-k="cut" class="c-cut">W 커트</span>
    <span data-k="side" class="c-side">E 사이드</span><span data-k="smash" class="c-smash">R 스매시</span>
  </div>
  <div id="shot-btns" hidden>
    <button type="button" data-k="drive" class="c-drive">드라이브</button><button type="button" data-k="drive side" class="c-side">사이드<br>드라이브</button><button type="button" data-k="smash" class="c-smash">스매시</button>
    <button type="button" data-k="cut" class="c-cut">커트</button><button type="button" data-k="cut side" class="c-side">사이드<br>커트</button><button type="button" data-k="side" class="c-side">사이드</button>
  </div>
  <div id="spin-badge" hidden></div>
  <div id="intro" class="overlay" hidden>
    <div class="box">
      <h1 style="font-size: 30px">조작 안내</h1>
      <table id="intro-controls" class="controls"></table>
      <label><input id="intro-never" type="checkbox"> 다시 보지 않기</label>
      <div class="row"><button id="intro-ok" type="button">시작</button></div>
    </div>
  </div>
  <div id="ping" hidden></div>
  <div id="net-msg" hidden></div>
  <button id="leave-btn" type="button" hidden title="나가기 (기권)">나가기</button>
  <div id="menu" class="overlay">
    <div class="box">
      <h1>1vs1 탁구</h1>
      <div id="menu-hint" class="hint">드래그로 치기 · Q/W/E/R 구질 · M 음소거 · Space 시점 바꾸기</div>
      <div class="row"><input id="menu-nick" type="text" maxlength="12" placeholder="닉네임" autocomplete="off"></div>
      <div class="row">
        <button id="menu-practice" type="button" class="sub">연습 (로봇)</button>
        <button id="menu-create" type="button">방 만들기</button>
      </div>
      <div class="row">
        <input id="menu-code" type="text" maxlength="4" placeholder="코드" autocomplete="off">
        <button id="menu-join" type="button">코드로 입장</button>
      </div>
      <div id="menu-error" class="err"></div>
    </div>
  </div>
  <div id="lobby" class="overlay" hidden>
    <div class="box">
      <div class="hint">방 코드</div>
      <div id="lobby-code"></div>
      <div class="row"><button id="lobby-copy" type="button" class="sub">초대 링크 복사</button></div>
      <div id="lobby-players"></div>
      <div id="lobby-status"></div>
      <div class="hint mob-only">대전 중 다른 앱으로 가거나 화면이 꺼지면 10초 뒤 기권패가 됩니다.</div>
      <div class="row"><button id="lobby-leave" type="button" class="sub">나가기</button></div>
    </div>
  </div>
  <div id="rotate"><div><div class="icon">📱↻</div>가로로 돌려 주세요</div></div>
  <div id="neterror" class="overlay" hidden>
    <div class="box">
      <div id="neterror-text" class="err"></div>
      <div class="row"><button id="neterror-back" type="button">첫 화면으로</button></div>
    </div>
  </div>
  <script>
    // 모듈 로드 실패(CDN 차단, WebGL 미지원 등)를 화면에 알린다.
    window.addEventListener('error', (e) => {
      document.getElementById('error').textContent = '오류: ' + (e.message || '스크립트를 불러오지 못했습니다.');
    });
    // 모듈 의존성(Three.js CDN) 로드 실패는 error 이벤트로 잡히지 않으므로 시간 초과로 안내한다.
    setTimeout(() => {
      if (document.getElementById('status').textContent === '불러오는 중…') {
        document.getElementById('error').textContent = '3D 엔진을 불러오지 못했습니다. 새로고침해 주세요.';
      }
    }, 10000);
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
