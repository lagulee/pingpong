<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>1vs1 탁구</title>
  <style>
    /* ── 화풍 (7단계 수정, 메뉴와 통일): 탁구장 포스터 — 종이색 바탕, 먹색 외곽선, 탁구대 초록, 공 주황, 각진 판과 어긋난 그림자.
       색은 여기 토큰에서만 정한다. 제목·숫자·버튼은 Black Han Sans(fonts/, OFL), 본문은 시스템 글꼴. */
    :root {
      --ink: #161616;        /* 외곽선·진한 글자 (먹색) */
      --ink-2: #5f594e;      /* 보조 글자 */
      --cream: #efe9dc;      /* 판·카드 (종이색) */
      --cream-2: #d6ccb6;    /* 구분선 */
      --cream-3: #e4dccb;    /* 판 안 칸 */
      --green: #1f6f4a; --green-2: #26825a;           /* 탁구대 */
      --red: #e04a2b; --red-2: #b3361b;               /* 나 */
      --lime: #ff7a1a; --lime-2: #cc5f10;             /* 강조·주 버튼 (공 주황). 이름은 v7.7 그대로 */
      --blue: #2d5fa8; --blue-2: #214a85;             /* 상대 */
      --yellow: #ffc93c;
      --sky: #efe9dc; --sky-2: #e4dccb;               /* 바탕 (3D 장면이 뜨기 전) */
      --font: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
      --display: "Black Han Sans", var(--font);
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
      /* 어떤 배경 위에서도 읽히는 글자 테두리 (화면 위에 떠 있는 글자용) */
      --stroke: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink),
        1.5px 1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px -1.5px 0 var(--ink), 0 4px 0 var(--ink);
      --stroke-thin: 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 0 2px 2px rgba(0, 0, 0, 0.35);
    }
    html, body { margin: 0; height: 100%; background: linear-gradient(var(--sky-2), var(--sky)); overflow: hidden; font-family: var(--font); }
    #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; } /* 터치: 스크롤·확대 대신 라켓 조작 */
    button { font-family: var(--font); }

    /* 공용 부품: 카드와 버튼 */
    .card {
      background: var(--cream); border: 3px solid var(--ink); border-radius: 3px; color: var(--ink);
      box-shadow: 6px 6px 0 var(--ink);
    }
    .btn, .overlay button, #again, #pause-menu, #leave-btn, #pause .go {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 11px 20px; border: 3px solid var(--ink); border-radius: 2px; background: var(--lime); color: var(--ink);
      font: 400 17px/1 var(--display); cursor: pointer; box-shadow: 4px 4px 0 var(--ink); transition: transform 0.06s, box-shadow 0.06s, filter 0.1s;
    }
    .btn:hover, .overlay button:hover, #again:hover, #pause-menu:hover, #leave-btn:hover, #pause:hover .go { background: var(--ink); color: var(--cream); filter: none; }
    .btn:active, .overlay button:active, #again:active, #pause-menu:active, #leave-btn:active {
      transform: translateY(3px); box-shadow: 1px 1px 0 var(--ink);
    }
    .overlay button { white-space: nowrap; }
    .overlay button.sub, #pause-menu, #leave-btn { background: var(--cream); }
    .overlay button.hot { background: var(--green); color: #fff; }
    kbd {
      display: inline-block; min-width: 1.3em; padding: 0 5px; border: 2px solid var(--ink); border-radius: 3px; background: #fff;
      color: var(--ink); font: 900 12px/1.5 var(--mono); text-align: center; box-shadow: 2px 2px 0 var(--ink); vertical-align: 1px;
    }
    /* ── 게임 화면 왼쪽 위: 상태 칩 + 판정 글자 ── */
    #hud { position: fixed; top: 12px; left: 14px; color: #fff; font: 800 14px/1.4 var(--font); pointer-events: none; max-width: calc(50vw - 200px); } /* 점수판(가운데)과 겹치지 않게 */
    #hud .hud-title { display: none; }
    #status {
      display: inline-block; padding: 5px 12px; border: 3px solid var(--ink); border-radius: 3px; background: var(--cream);
      color: var(--ink); font: 400 14px/1.2 var(--display); box-shadow: 3px 3px 0 var(--ink);
    }
    #keys-hint { margin-top: 6px; color: #fff; font: 700 12px/1.6 var(--font); text-shadow: var(--stroke-thin); }
    #keys-hint:empty { display: none; }
    #keys-hint kbd { font-size: 11px; text-shadow: none; }
    #error { color: #fff; background: var(--red); border: 3px solid var(--ink); border-radius: 3px; padding: 0 8px; margin-top: 6px; }
    #error:empty { display: none; }
    /* 마지막 구질 판정 (손으로 확인할 때 보는 글자) */
    #shot { margin-top: 10px; font: 400 30px/1.1 var(--display); letter-spacing: 0.02em; min-height: 33px; color: #fff; text-shadow: var(--stroke); }
    #shot.shot-perfect { color: var(--yellow); }
    #shot.shot-good { color: #8ff08f; }
    #shot.shot-ok { color: #a9ccff; }
    #shot.shot-bad { color: #ff9a8f; }
    #shot-sub, #robot-shot { margin-top: 4px; font: 800 13px/1.4 var(--font); color: #fff; min-height: 18px; text-shadow: var(--stroke-thin); }
    #combo { margin-top: 4px; font: 400 17px/1.3 var(--display); text-shadow: var(--stroke); }
    #combo[hidden] { display: none; }
    /* 빗나감 표시 (7단계 수정): 빠름 = 파랑, 느림 = 빨강, 자리 = 노랑 */
    #miss { margin-top: 6px; display: inline-block; padding: 2px 10px; border: 3px solid var(--ink); border-radius: 3px;
      font: 400 22px/1.2 var(--display); color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
    #miss[hidden] { display: none; }
    #miss.miss-early { background: #8fc4ff; }
    #miss.miss-late { background: #ff9a8f; }
    #miss.miss-pos { background: var(--yellow); }

    /* ── 점수판 (화면 위 가운데): 내 점수 빨강 칸, 상대 점수 파랑 칸 ── */
    #scoreboard {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      display: grid; grid-template-columns: minmax(72px, auto) auto auto auto minmax(72px, auto); align-items: center; column-gap: 8px;
      padding: 7px 12px 6px; pointer-events: none; text-align: center; font: 400 15px/1.2 var(--display);
    }
    #scoreboard .name { display: flex; flex-direction: column; align-items: center; gap: 3px; white-space: nowrap; max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
    #scoreboard .pts {
      min-width: 1.5em; padding: 4px 8px 2px; border: 3px solid var(--ink); border-radius: 3px; color: #fff;
      font: 400 32px/1 var(--display); font-variant-numeric: tabular-nums; text-shadow: var(--stroke-thin); box-shadow: 3px 3px 0 var(--ink);
    }
    #scoreboard .pts.me { background: var(--red); }
    #scoreboard .pts.robot { background: var(--blue); }
    #scoreboard .sep { font: 400 26px/1 var(--display); color: var(--ink); }
    #scoreboard .name.me { color: var(--red-2); }
    #scoreboard .name.robot { color: var(--blue-2); }
    #scoreboard .serve {
      padding: 1px 7px; border: 2px solid var(--ink); border-radius: 3px; background: var(--yellow); color: var(--ink); font: 800 11px/1.3 var(--font);
    }
    #serve-info { grid-column: 1 / 6; margin-top: 5px; padding-top: 4px; border-top: 2px dashed var(--cream-2); font: 800 12px/1.3 var(--font); color: var(--ink-2); }
    #serve-info:empty { display: none; }

    /* ── 가운데 안내 글자 ── */
    /* 가운데 안내: 종이색 띠 (글자 테두리 대신 판 위에 먹색 글자 → 긴 문장도 읽기 쉽다). 결과 색은 띠 색으로 */
    #center {
      position: fixed; left: 50%; top: 24%; transform: translate(-50%, -50%); max-width: 80vw; /* 탁구대 먼 쪽을 가리지 않게 위로 */
      padding: 8px 18px; border: 3px solid var(--ink); border-radius: 2px; background: var(--cream); box-shadow: 5px 5px 0 var(--ink);
      color: var(--ink); font: 800 18px/1.45 var(--font); pointer-events: none; text-align: center; white-space: pre-line;
    }
    #center:empty { display: none; }
    #center::first-line { font-family: var(--display); font-weight: 400; font-size: 24px; }
    #center.center-win { background: var(--green); color: #fff; }
    #center.center-lose { background: var(--red); color: #fff; }
    #center.center-neutral { background: var(--yellow); }
    #center.center-tentative { background: var(--cream-3); color: var(--ink-2); }
    #center.center-corrected { background: var(--yellow); }

    /* ── 버전 표시 (배포 반영 확인용) ── */
    #version {
      position: fixed; left: 10px; bottom: 8px; color: rgba(34, 38, 46, 0.55);
      font: 800 12px/1 var(--mono); pointer-events: none;
    }

    /* ── 덮개 화면 공용 (첫 화면·대기실·안내·결과·오류) ── */
    .overlay, #result {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(239, 233, 220, 0.78); backdrop-filter: blur(2px); z-index: 20;
    }
    .overlay[hidden], #result[hidden] { display: none; }
    .overlay .box, #result .box {
      min-width: 300px; max-width: 440px; padding: 26px 30px 24px; text-align: center; font: 700 15px/1.6 var(--font);
    }
    .overlay h1 { margin: 0 0 8px; font: 400 34px/1.1 var(--display); }
    .overlay .row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
    .overlay input[type=text] {
      padding: 10px 12px; border: 3px solid var(--ink); border-radius: 3px; background: #fff; color: var(--ink);
      font: 400 16px/1 var(--display); width: 160px; text-align: center; box-shadow: inset 0 3px 0 var(--cream-3); outline: none;
    }
    .overlay input[type=text]:focus { border-color: var(--blue); }
    .overlay .hint { color: var(--ink-2); font-size: 13px; }
    .overlay .err { color: var(--red-2); min-height: 22px; margin-top: 10px; font-weight: 900; }

    /* 첫 화면 (7단계 수정): 위에서 본 탁구대. 왼쪽 코트 = 연습, 오른쪽 코트 = 대전. 종이색 바탕, 포스터 글꼴(Black Han Sans).
       색은 --m-* 토큰에서만 정한다 (게임 화면 UI 토큰과 분리). */
    #menu {
      --m-paper: var(--cream); --m-ink: var(--ink); --m-mute: var(--ink-2);
      --m-table: var(--green); --m-table-hi: var(--green-2); --m-line: #ffffff; --m-ball: var(--lime);
      --m-display: var(--display);
      background: var(--m-paper); backdrop-filter: none; color: var(--m-ink);
    }
    #menu .m-wrap { width: min(860px, 92vw); }
    #menu .m-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    #menu .m-title { margin: 0; font: 400 112px/0.86 var(--m-display); letter-spacing: -0.02em; color: var(--m-ink); }
    #menu .m-title i {
      display: inline-block; width: 0.22em; height: 0.22em; margin-left: 0.06em; border-radius: 50%; background: var(--m-ball); vertical-align: baseline;
    }
    #menu .m-sub { margin-top: 12px; font: 800 13px/1 var(--mono); letter-spacing: 0.2em; color: var(--m-mute); }
    #menu .m-nick { display: flex; flex-direction: column; gap: 6px; font: 800 12px/1 var(--mono); letter-spacing: 0.15em; color: var(--m-mute); }
    #menu input[type=text] {
      padding: 6px 2px; border: 0; border-bottom: 3px solid var(--m-ink); border-radius: 0; background: none; box-shadow: none; outline: none;
      color: var(--m-ink); font: 400 24px/1.1 var(--m-display); text-align: left;
    }
    #menu input[type=text]::placeholder { color: rgba(22, 22, 22, 0.3); }
    #menu-nick { width: 220px; }
    /* 탁구대: 흰 테두리 + 가운데 네트 */
    #menu .m-table {
      display: grid; grid-template-columns: 1fr 14px 1fr; aspect-ratio: 2.74 / 1.525; max-height: 62vh; margin: 0 auto;
      background: var(--m-table); border: 6px solid var(--m-line); outline: 3px solid var(--m-ink);
    }
    #menu .m-net { background: var(--m-ink); border-left: 3px solid var(--m-line); border-right: 3px solid var(--m-line); }
    #menu .m-court {
      display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 6px;
      padding: 26px 28px; color: var(--m-line); text-align: left; font: 700 14px/1.4 var(--font);
    }
    #menu .m-court .m-k { font: 400 64px/1 var(--m-display); }
    #menu .m-court .m-d { opacity: 0.75; margin-bottom: 10px; }
    #menu button.m-court {
      width: auto; padding: 26px 28px; border: 0; border-radius: 0; background: none; box-shadow: none; cursor: pointer; transition: background 0.12s;
    }
    #menu button.m-court:hover { background: var(--m-table-hi); filter: none; }
    #menu button.m-court:active { transform: none; box-shadow: none; }
    #menu .m-go { font: 400 22px/1 var(--m-display); color: var(--m-ball); }
    /* 연습 코트 위 공 하나 (장식) */
    #menu button.m-court { position: relative; }
    #menu button.m-court::before {
      content: ""; position: absolute; left: 62%; top: 24%; width: 18px; height: 18px; border-radius: 50%; background: var(--m-ball);
      box-shadow: -14px 22px 0 -4px rgba(0, 0, 0, 0.18); transition: transform 0.2s;
    }
    #menu button.m-court:hover::before { transform: translate(-30px, -14px); }
    #menu .m-btn {
      padding: 12px 18px; border: 3px solid var(--m-line); border-radius: 2px; background: var(--m-line); color: var(--m-table);
      font: 400 20px/1 var(--m-display); box-shadow: none; cursor: pointer;
    }
    #menu .m-btn:hover { background: var(--m-ball); border-color: var(--m-ball); color: var(--m-ink); filter: none; }
    #menu .m-btn:active { transform: translateY(1px); box-shadow: none; }
    #menu .m-btn.m-ghost { background: none; color: var(--m-line); }
    #menu .m-btn.m-ghost:hover { background: var(--m-line); border-color: var(--m-line); color: var(--m-table); }
    #menu .m-join { display: flex; align-items: flex-end; gap: 10px; margin-top: 8px; }
    #menu #menu-code {
      width: 120px; color: var(--m-line); border-bottom-color: var(--m-line); text-transform: uppercase; letter-spacing: 0.2em; font-size: 22px;
    }
    #menu #menu-code::placeholder { color: rgba(255, 255, 255, 0.45); letter-spacing: 0.05em; }
    #menu .err { min-height: 0; margin-top: 12px; color: #c0392b; text-align: left; }
    #menu .err:empty { display: none; }
    #menu-hint { margin-top: 14px; color: var(--m-mute); font-size: 12px; line-height: 1.5; text-align: left; }
    #lobby-code {
      display: inline-block; margin: 6px 0; padding: 6px 18px; border: 3px solid var(--ink); border-radius: 3px; background: var(--lime);
      font: 900 48px/1.1 var(--mono); letter-spacing: 0.18em; color: var(--ink); box-shadow: 5px 5px 0 var(--ink);
    }
    #lobby-players { margin: 10px 0 4px; text-align: left; display: inline-block; white-space: pre-line; }
    #lobby-status { color: var(--ink-2); min-height: 22px; }

    /* 결과 화면 */
    #result .box { min-width: 300px; }
    #result-title { margin: 6px 0 8px; font: 400 44px/1.1 var(--display); }
    #result-title.result-win { color: var(--yellow); text-shadow: var(--stroke); }
    #result-title.result-lose { color: var(--blue); text-shadow: var(--stroke); }
    #result-score { color: var(--ink-2); }
    #again { margin-top: 18px; padding: 13px 30px; font-size: 18px; }

    /* ── 대전: 핑 (오른쪽 위), 연결 안내, 나가기 ── */
    #ping {
      position: fixed; top: 12px; right: 56px; padding: 4px 10px; border: 3px solid var(--ink); border-radius: 3px; background: var(--cream);
      color: var(--ink); font: 800 12px/1.3 var(--mono); pointer-events: none; box-shadow: 3px 3px 0 var(--ink);
    }
    #ping[hidden] { display: none; }
    #ping.good { border-left: 10px solid #3fae4a; }
    #ping.ok { border-left: 10px solid #e8b11a; }
    #ping.bad { border-left: 10px solid var(--red); }
    #net-msg {
      position: fixed; left: 50%; top: 22%; transform: translateX(-50%); padding: 9px 18px; border: 3px solid var(--ink); border-radius: 3px;
      background: var(--red); color: #fff; font: 400 17px/1.4 var(--display); text-shadow: var(--stroke-thin); pointer-events: none; z-index: 12;
      box-shadow: 4px 4px 0 var(--ink);
    }
    #net-msg[hidden] { display: none; }
    #leave-btn { position: fixed; top: 52px; right: 12px; z-index: 10; padding: 7px 14px; font-size: 13px; }
    #leave-btn[hidden] { display: none; }
    body:has(#debug:not(.collapsed)) #ping { right: 356px; }
    body:has(#debug:not(.collapsed)) #leave-btn, body:has(#debug:not(.collapsed)) #settings-btn,
    body:has(#debug:not(.collapsed)) #settings { right: 316px; }
    body:not(.mobile) #debug.collapsed { top: 50px; } /* 접힌 디버그 버튼이 설정 ⚙과 겹치지 않게 */

    /* ── 동그란 아이콘 버튼 (설정 ⚙, 일시정지 ⏸, 전체 화면 ⛶) ── */
    #settings-btn, #audio-ui button {
      width: 38px; height: 38px; padding: 0; border: 3px solid var(--ink); border-radius: 3px; background: var(--cream); color: var(--ink);
      font: 400 18px/1 var(--display); cursor: pointer; box-shadow: 3px 3px 0 var(--ink); display: inline-flex; align-items: center; justify-content: center;
    }
    #settings-btn:active, #audio-ui button:active { transform: translateY(2px); box-shadow: 1px 1px 0 var(--ink); }
    #settings-btn { position: fixed; top: 8px; right: 12px; z-index: 31; }
    #settings-btn.on { background: var(--lime); }

    /* ── 설정 패널 ── */
    #settings {
      position: fixed; top: 56px; right: 12px; z-index: 31; width: 280px; max-height: calc(100vh - 72px); overflow-y: auto;
      box-sizing: border-box; padding: 12px 16px 14px; font: 700 14px/1.45 var(--font);
    }
    #settings[hidden] { display: none; }
    #settings .set-head { display: flex; justify-content: space-between; align-items: center; font: 400 18px/1.2 var(--display); }
    #settings .set-head button {
      width: 30px; height: 30px; border: 2px solid var(--ink); border-radius: 3px; background: #fff; color: var(--ink);
      font: 400 14px/1 var(--display); cursor: pointer; box-shadow: 2px 2px 0 var(--ink);
    }
    #settings .set-sec {
      margin: 14px 0 6px; padding: 2px 8px; display: inline-block; border-radius: 3px; background: var(--ink); color: var(--cream);
      font: 800 11px/1.5 var(--font); letter-spacing: 0.08em;
    }
    /* 조작 모드: 레퍼런스의 탭 막대처럼 고른 칸이 연두 */
    #settings .seg { display: grid; grid-template-columns: 1fr 1fr; border: 3px solid var(--ink); border-radius: 3px; overflow: hidden; background: var(--cream-3); box-shadow: 3px 3px 0 var(--ink); }
    #settings .seg button {
      padding: 9px 4px; border: 0; background: none; color: var(--ink-2); font: 400 15px/1.2 var(--display); cursor: pointer;
    }
    #settings .seg button + button { border-left: 3px solid var(--ink); }
    #settings .seg button small { display: block; font-weight: 700; font-size: 11px; }
    #settings .seg button.on { background: var(--lime); color: var(--ink); }
    #settings .set-desc { margin-top: 8px; color: var(--ink-2); font-size: 12px; line-height: 1.5; }
    #settings .set-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; padding: 3px 0; cursor: pointer; white-space: nowrap; }
    #settings .set-row input[type=range] { flex: 1; min-width: 0; accent-color: var(--lime); }
    #settings .set-row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--lime-2); }
    #settings .set-row kbd { margin-left: auto; }
    /* 숨은 치트: 평범한 장식처럼 보이는 작은 글자 */
    #set-cheat { display: block; margin: 10px 0 0 auto; padding: 0; border: 0; background: none; color: var(--ink-2); font: 700 11px/1.2 inherit; cursor: pointer; opacity: 0.55; }
    #set-cheat.on { opacity: 1; }
    #cheat-box { display: flex; gap: 6px; margin-top: 6px; }
    #cheat-box[hidden] { display: none; }
    #cheat-box input { flex: 1; min-width: 0; padding: 4px 6px; border: 2px solid var(--ink); border-radius: 3px; font: inherit; }
    #cheat-box button { padding: 4px 10px; border: 2px solid var(--ink); border-radius: 3px; background: var(--lime); font: 700 12px/1 inherit; cursor: pointer; }
    #cheat-pick { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
    #cheat-pick[hidden] { display: none; }
    #cheat-pick button { padding: 4px 14px; border: 2px solid var(--ink); border-radius: 3px; background: var(--cream-3); font: 700 13px/1 inherit; cursor: pointer; }
    #cheat-msg { min-height: 0; margin-top: 4px; color: var(--ink-2); font-size: 11px; text-align: right; }

    /* ── 음소거·일시정지 (왼쪽 아래, 버전 위) ── */
    #audio-ui { position: fixed; left: 10px; bottom: 28px; display: flex; align-items: center; gap: 6px; z-index: 10; }

    /* ── 일시정지 화면 ── */
    #pause {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(239, 233, 220, 0.78); backdrop-filter: blur(2px); cursor: pointer; z-index: 18;
    }
    #pause[hidden] { display: none; }
    #pause .box { max-width: 560px; max-height: 92vh; overflow-y: auto; box-sizing: border-box; padding: 22px 28px; text-align: center; font: 700 14px/1.6 var(--font); }
    #pause h1 { margin: 0 0 4px; font: 400 34px/1.1 var(--display); }
    #pause-hint, #pause-hint2 { color: var(--ink-2); font-size: 13px; }
    #pause .go { margin-top: 14px; padding: 12px 32px; font-size: 18px; }
    #pause-menu { margin-top: 10px; padding: 9px 20px; font-size: 14px; }
    #pause-menu[hidden] { display: none; }

    /* 조작표 (일시정지·첫 경기 안내) */
    .controls { margin: 12px auto 0; border-collapse: separate; border-spacing: 0; font: 700 13px/1.5 var(--font); text-align: left; background: #fff; border: 3px solid var(--ink); border-radius: 3px; overflow: hidden; }
    .controls td { padding: 4px 10px; border-bottom: 2px solid var(--cream-3); }
    .controls tr:last-child td { border-bottom: 0; }
    .controls td:first-child { text-align: right; white-space: nowrap; font-weight: 900; background: var(--cream-3); }
    .controls .k-drive { color: var(--red); } .controls .k-cut { color: var(--blue); } .controls .k-side { color: #8a44d8; } .controls .k-smash { color: #e07a00; }
    .controls .note { color: var(--ink-2); font-size: 12px; padding-top: 4px; }
    #intro .box { max-width: 520px; }
    #intro label { display: block; margin-top: 12px; color: var(--ink-2); font-size: 13px; }

    /* ── 구질 버튼: PC 키 표시(아래 가운데)와 모바일 화면 버튼 (7단계) ── */
    .c-drive { --c: var(--red); color: var(--red); } .c-cut { --c: var(--blue); color: var(--blue); } .c-side { --c: #8a44d8; color: #8a44d8; }
    .c-smash { --c: #f08a12; color: #e07a00; } .c-normal { --c: var(--ink); color: var(--ink); }
    #shot-keys {
      position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: none;
      font: 800 13px/1 var(--font);
    }
    #shot-keys[hidden], #shot-btns[hidden], #spin-badge[hidden] { display: none; }
    #shot-keys span {
      padding: 7px 11px; border: 3px solid var(--ink); border-radius: 3px; background: var(--cream); box-shadow: 3px 3px 0 var(--ink);
      opacity: 0.75; transition: transform 0.06s;
    }
    #shot-keys span.on { opacity: 1; background: var(--c); color: #fff; text-shadow: var(--stroke-thin); transform: translateY(2px); box-shadow: 1px 1px 0 var(--ink); }
    #shot-btns {
      position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); left: calc(56px + env(safe-area-inset-left));
      display: grid; grid-template-columns: repeat(3, var(--btn, 64px)); gap: 8px; z-index: 11; touch-action: none;
    }
    #shot-btns.right { left: auto; right: calc(14px + env(safe-area-inset-right)); }
    #shot-btns button {
      width: var(--btn, 64px); height: var(--btn, 64px); border-radius: 3px; border: 3px solid var(--ink);
      background: var(--cream); font: 800 13px/1.1 var(--font); opacity: 0.88; touch-action: none; box-shadow: 4px 4px 0 var(--ink);
      -webkit-user-select: none; user-select: none; padding: 0;
    }
    #shot-btns button.on { opacity: 1; background: var(--c); color: #fff; text-shadow: var(--stroke-thin); transform: translateY(3px); box-shadow: 1px 1px 0 var(--ink); }

    /* 들어오는 공의 회전 표지 (내 예측 정점 고리 위) */
    #spin-badge {
      position: fixed; transform: translate(-50%, -100%); padding: 2px 9px; border: 3px solid var(--ink); border-radius: 3px; background: var(--cream);
      font: 400 14px/1.3 var(--display); pointer-events: none; white-space: nowrap; z-index: 5; box-shadow: 3px 3px 0 var(--ink);
    }

    /* 판정 팝업: 공 위치에서 튀어 올랐다 사라짐 */
    #popups { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .popup {
      position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-weight: 400;
      letter-spacing: 0.04em; text-shadow: var(--stroke); white-space: nowrap;
      animation-name: popup-rise; animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1); animation-fill-mode: forwards;
    }
    @keyframes popup-rise {
      0% { transform: translate(-50%, -50%) scale(0.4) rotate(-6deg); opacity: 0; }
      15% { transform: translate(-50%, -50%) scale(1.25) rotate(3deg); opacity: 1; }
      30% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
      100% { transform: translate(-50%, calc(-50% + var(--rise))) scale(1); opacity: 0; }
    }

    /* ── 사운드 테스트 (?sound=1), 디버그 패널 (?debug=1): 개발용이라 어두운 패널 그대로 ── */
    #soundtest {
      position: fixed; left: 8px; top: 50%; transform: translateY(-50%); max-height: 80vh; overflow-y: auto;
      padding: 8px 12px; border-radius: 10px; background: rgba(12, 16, 24, 0.9); color: #dfe7f2;
      font: 12px/1.35 system-ui, sans-serif; z-index: 15;
    }
    #soundtest h3 { margin: 2px 0 6px; font-size: 13px; color: #9fc3ff; }
    #soundtest .st-row { display: grid; grid-template-columns: 96px repeat(4, auto); gap: 4px; align-items: center; margin: 3px 0; }
    #soundtest button {
      background: #26324a; color: #e8eef7; border: 1px solid #3d4d6e; border-radius: 4px;
      padding: 3px 8px; font: inherit; cursor: pointer;
    }
    #soundtest button:hover { background: #33446a; }
    #soundtest .st-info { margin: 8px 0 0; max-width: 340px; white-space: pre-wrap; font: 11px/1.4 ui-monospace, monospace; color: #c9d3e0; }
    #debug {
      position: fixed; top: 0; right: 0; width: 300px; max-height: 100vh; overflow-y: auto;
      box-sizing: border-box; padding: 8px 12px 16px;
      background: rgba(12, 16, 24, 0.88); color: #dfe7f2;
      font: 12px/1.35 system-ui, sans-serif;
    }
    #debug h3 { margin: 10px 0 4px; font-size: 13px; color: #9fc3ff; }
    #debug .dbg-row { display: grid; grid-template-columns: 1fr auto; column-gap: 6px; margin: 3px 0; }
    #debug .dbg-row input { grid-column: 1 / 3; width: 100%; margin: 0; }
    #debug .dbg-val { font-variant-numeric: tabular-nums; color: #ffd27a; }
    #debug .dbg-buttons { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; align-items: center; }
    #debug button {
      background: #26324a; color: #e8eef7; border: 1px solid #3d4d6e; border-radius: 4px;
      padding: 3px 8px; font: inherit; cursor: pointer;
    }
    #debug button:hover { background: #33446a; }
    #debug .dbg-fire { background: #2f6b3a; border-color: #4a9a5a; }
    #debug .dbg-msg { color: #8fe39a; }
    #debug .dbg-info { margin: 3px 0; font-variant-numeric: tabular-nums; }
    #debug .dbg-log { white-space: pre; font: 11px/1.4 ui-monospace, monospace; color: #c9d3e0; overflow-x: auto; }
    #debug .dbg-group { margin: 4px 0; border-left: 2px solid #33446a; padding-left: 6px; }
    #debug .dbg-group summary { cursor: pointer; color: #cfe0ff; margin: 2px 0; }
    #debug .dbg-toggle { display: flex; gap: 6px; align-items: center; margin: 5px 0 2px; color: #ffd27a; }
    #debug .dbg-lock { margin: 4px 0; padding: 4px 6px; border-radius: 4px; background: #4a2a2a; color: #ffd6d0; }
    #debug [disabled] { opacity: 0.45; }
    #debug .dbg-head { display: flex; justify-content: flex-end; }
    #debug.collapsed { width: auto; padding: 4px; background: none; overflow: visible; }
    #debug.collapsed > :not(.dbg-head) { display: none; }
    #debug.collapsed .dbg-head button {
      background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 0 3px 0 var(--ink); padding: 4px 8px;
    }

    /* 세로 화면 안내 (모바일) */
    #rotate {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 50;
      background: linear-gradient(var(--sky-2), var(--sky)); color: var(--ink); font: 400 22px/1.5 var(--display); text-align: center;
    }
    #rotate > div { padding: 22px 30px; }
    #rotate .icon { font-size: 54px; }
    .mob-only { display: none !important; }
    body.mobile .pc-only { display: none !important; }

    /* ── 모바일 모드 (6단계): body.mobile. 손가락 크기(44 px 이상) 버튼, 노치 여백, 스크롤·확대·길게 누르기 막기 ── */
    body.mobile {
      touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
    }
    body.mobile input { -webkit-user-select: text; user-select: text; touch-action: manipulation; }
    body.mobile .mob-only { display: inline-flex !important; }
    @media (orientation: portrait) { body.mobile #rotate { display: flex; } }
    body.mobile #hud { top: calc(6px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left)); font-size: 12px; max-width: 34vw; }
    body.mobile #status { font-size: 11px; padding: 3px 8px; border-width: 2px; }
    body.mobile #keys-hint { display: none; }
    body.mobile #shot { font-size: 20px; min-height: 22px; margin-top: 6px; }
    body.mobile #shot-sub, body.mobile #robot-shot { font-size: 11px; min-height: 14px; max-width: 34vw; }
    body.mobile #scoreboard { top: calc(4px + env(safe-area-inset-top)); padding: 3px 8px; column-gap: 5px; font-size: 11px; border-radius: 3px; }
    body.mobile #scoreboard .pts { font-size: 22px; padding: 3px 6px 1px; }
    body.mobile #scoreboard .sep { font-size: 18px; }
    body.mobile #scoreboard .serve { font-size: 9px; }
    body.mobile #serve-info { font-size: 10px; margin-top: 3px; padding-top: 2px; }
    body.mobile #center { font-size: 13px; top: 40%; padding: 5px 12px; }
    body.mobile #center::first-line { font-size: 17px; }
    body.mobile #audio-ui {
      left: auto; bottom: auto; right: calc(58px + env(safe-area-inset-right)); top: calc(4px + env(safe-area-inset-top)); gap: 6px;
    }
    body.mobile #audio-ui button { width: 44px; height: 44px; font-size: 22px; }
    body.mobile #audio-ui button[hidden] { display: none !important; }
    body.mobile #settings-btn {
      top: calc(4px + env(safe-area-inset-top)); right: calc(6px + env(safe-area-inset-right)); width: 44px; height: 44px; font-size: 22px;
    }
    body.mobile #settings {
      top: calc(56px + env(safe-area-inset-top)); right: calc(6px + env(safe-area-inset-right)); max-height: calc(100vh - 66px - env(safe-area-inset-top));
    }
    body.mobile #settings .seg button, body.mobile #settings .set-row { min-height: 40px; }
    body.mobile #settings .set-row input[type=checkbox] { width: 20px; height: 20px; }
    body.mobile #ping { top: calc(56px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); font-size: 10px; padding: 2px 6px; }
    body.mobile #leave-btn { top: calc(84px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); min-height: 40px; }
    body.mobile #net-msg { font-size: 14px; top: 30%; }
    body.mobile #version { left: calc(10px + env(safe-area-inset-left)); bottom: calc(6px + env(safe-area-inset-bottom)); }
    body.mobile .overlay .box { padding: 12px 18px; max-height: 92vh; overflow-y: auto; box-sizing: border-box; }
    /* 가로 휴대폰 첫 화면: 머리줄을 줄이고 탁구대를 남은 높이에 맞춘다 */
    body.mobile #menu .m-wrap { width: 92vw; }
    body.mobile #menu .m-head { margin-bottom: 10px; margin-right: 52px; } /* 오른쪽 위 ⚙ 버튼 자리 */
    body.mobile #menu-nick { width: 170px; }
    body.mobile #menu .m-title { font-size: 54px; }
    body.mobile #menu .m-sub { margin-top: 6px; font-size: 10px; }
    body.mobile #menu .m-table { aspect-ratio: auto; height: 58vh; max-height: none; }
    body.mobile #menu .m-court, body.mobile #menu button.m-court { padding: 12px 16px; }
    body.mobile #menu .m-court .m-k { font-size: 40px; }
    body.mobile #menu .m-court .m-d { margin-bottom: 4px; font-size: 12px; }
    body.mobile #menu .m-btn { min-height: 44px; padding: 0 14px; font-size: 17px; }
    body.mobile #menu input[type=text] { min-height: 40px; font-size: 20px; }
    body.mobile #menu-hint { display: none; }
    body.mobile .overlay h1 { font-size: 26px; }
    body.mobile .overlay button, body.mobile .overlay input[type=text] { min-height: 44px; }
    body.mobile .overlay .row { margin-top: 8px; }
    body.mobile #lobby-code { font-size: 32px; }
    body.mobile #pause .box { padding: 12px 18px; }
    body.mobile #pause h1 { font-size: 26px; }
    body.mobile #pause-actions { gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
    body.mobile #pause-actions button {
      min-height: 44px; min-width: 64px; padding: 0 12px; border: 3px solid var(--ink); border-radius: 3px; background: var(--cream);
      color: var(--ink); font: 400 14px/1 var(--display); box-shadow: 3px 3px 0 var(--ink);
    }
    body.mobile #result .box { padding: 14px 20px; }
    body.mobile #result-title { font-size: 30px; }
    body.mobile #debug { left: 0; right: auto; width: min(320px, 60vw); font-size: 11px; padding-left: calc(8px + env(safe-area-inset-left)); }
    body.mobile #debug.collapsed {
      width: auto; top: auto; bottom: calc(24px + env(safe-area-inset-bottom)); left: calc(4px + env(safe-area-inset-left)); padding: 0;
    }
    body.mobile #debug button { min-height: 32px; }
    body.mobile #debug .dbg-head button { min-height: 40px; }
  </style>
  <link rel="stylesheet" href="fonts/black-han-sans.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="hud-title">1vs1 탁구</div>
    <div id="status">불러오는 중…</div>
    <div id="keys-hint"></div>
    <div id="error"></div>
    <div id="shot"></div>
    <div id="shot-sub"></div>
    <div id="combo" hidden></div>
    <div id="miss" hidden></div>
    <div id="robot-shot"></div>
  </div>
  <div id="scoreboard" class="card">
    <span class="name me"><span id="name-me">나</span><span id="serve-me" class="serve">● 서브</span></span>
    <span id="score-me" class="pts me">0</span>
    <span class="sep">:</span>
    <span id="score-robot" class="pts robot">0</span>
    <span class="name robot"><span id="name-robot">로봇</span><span id="serve-robot" class="serve">● 서브</span></span>
    <div id="serve-info"></div>
  </div>
  <div id="center"></div>
  <div id="result" hidden>
    <div class="box card">
      <h2 id="result-title"></h2>
      <div id="result-score"></div>
      <button id="again" type="button">다시 하기</button>
    </div>
  </div>
  <div id="popups"></div>
  <div id="audio-ui">
    <button id="pause-btn" type="button" title="일시정지 (P)">⏸</button>
    <button id="fs-btn" class="mob-only" type="button" title="전체 화면">⛶</button>
  </div>
  <div id="version"></div>
  <button id="settings-btn" type="button" title="설정 (Tab)">⚙</button>
  <div id="settings" class="card" hidden>
    <div class="set-head">설정 <button id="settings-close" type="button" title="닫기 (Tab · Esc)">✕</button></div>
    <div class="set-sec">조작 모드</div>
    <div id="set-control" class="seg">
      <button type="button" data-v="basic">기본<small>스윙 방향으로 구질</small></button>
      <button type="button" data-v="advanced">고급<small id="set-adv-sub">Q·W·E·R 구질 버튼</small></button>
    </div>
    <div id="set-control-desc" class="set-desc"></div>
    <div class="set-sec">소리</div>
    <label class="set-row"><input id="set-sound" type="checkbox"> 소리 켜기 <kbd class="pc-only">M</kbd></label>
    <label class="set-row">음량 <input id="volume" type="range" min="0" max="1" step="0.01"></label>
    <label class="set-row"><input id="set-crowd" type="checkbox"> 관중 함성</label>
    <label class="set-row"><input id="set-heart" type="checkbox"> 매치포인트 심장 박동</label>
    <div class="set-sec">화면</div>
    <label class="set-row"><input id="set-view" type="checkbox"> 정면 시점 <kbd class="pc-only">Space</kbd></label>
    <label class="set-row">시점 거리 <input id="set-dist" type="range"> <span id="set-dist-val"></span> <kbd class="pc-only">휠</kbd></label>
    <label class="set-row"><input id="set-guide" type="checkbox"> 서브 가이드 <kbd class="pc-only">G</kbd></label>
    <label class="set-row"><input id="set-shake" type="checkbox"> 화면 흔들림</label>
    <label class="set-row mob-only"><input id="set-vibrate" type="checkbox"> 진동</label>
    <button id="set-cheat" type="button" title="진솔쌤">진솔쌤❤️</button>
    <form id="cheat-box" hidden>
      <input id="cheat-pw" type="password" inputmode="numeric" maxlength="8" placeholder="비밀번호" autocomplete="off">
      <button type="submit">확인</button>
    </form>
    <div id="cheat-pick" hidden>
      <button type="button" data-m="attack">공</button>
      <button type="button" data-m="defense">수</button>
    </div>
    <div id="cheat-msg"></div>
  </div>
  <div id="pause" hidden>
    <div class="box card">
      <h1>일시정지</h1>
      <div id="pause-hint">P · Esc 또는 클릭하면 이어서 합니다.</div>
      <div id="pause-hint2">탭을 옮기면 자동으로 멈춥니다.</div>
      <div id="pause-actions" class="mob-only">
        <button type="button" data-diff="EASY">쉬움</button>
        <button type="button" data-diff="NORMAL">보통</button>
        <button type="button" data-diff="HARD">어려움</button>
        <button id="pause-new" type="button">새 게임</button>
        <button id="pause-arrows" type="button">화살표</button>
      </div>
      <table id="pause-controls" class="controls"></table>
      <div class="go">계속하기</div>
      <div><button id="pause-menu" type="button">메인화면으로</button></div>
    </div>
  </div>
  <div id="shot-keys" hidden>
    <span data-k="drive" class="c-drive">Q 드라이브</span><span data-k="cut" class="c-cut">W 커트</span>
    <span data-k="side" class="c-side">E 사이드</span><span data-k="smash" class="c-smash">R 스매시</span>
  </div>
  <div id="shot-btns" hidden>
    <button type="button" data-k="drive" class="c-drive">드라이브</button><button type="button" data-k="drive side" class="c-side">사이드<br>드라이브</button><button type="button" data-k="smash" class="c-smash">스매시</button>
    <button type="button" data-k="cut" class="c-cut">커트</button><button type="button" data-k="cut side" class="c-side">사이드<br>커트</button><button type="button" data-k="side" class="c-side">사이드</button>
  </div>
  <div id="spin-badge" hidden></div>
  <div id="intro" class="overlay" hidden>
    <div class="box card">
      <h1>조작 안내</h1>
      <table id="intro-controls" class="controls"></table>
      <label><input id="intro-never" type="checkbox"> 다시 보지 않기</label>
      <div class="row"><button id="intro-ok" type="button">시작</button></div>
    </div>
  </div>
  <div id="ping" hidden></div>
  <div id="net-msg" hidden></div>
  <button id="leave-btn" type="button" hidden title="나가기 (기권)">나가기</button>
  <div id="menu" class="overlay">
    <div class="m-wrap">
      <div class="m-head">
        <div>
          <h1 class="m-title">탁구<i></i></h1>
          <div class="m-sub">1 VS 1 · TABLE TENNIS</div>
        </div>
        <label class="m-nick">닉네임 <input id="menu-nick" type="text" maxlength="12" placeholder="이름 입력" autocomplete="off"></label>
      </div>
      <div class="m-table">
        <button id="menu-practice" type="button" class="m-court">
          <span class="m-k">연습</span><span class="m-d">로봇 상대 · 11점 한 게임</span><span class="m-go">시작 →</span>
        </button>
        <div class="m-net"></div>
        <div class="m-court">
          <span class="m-k">대전</span><span class="m-d">친구에게 방 코드를 보내 1:1</span>
          <button id="menu-create" type="button" class="m-btn">방 만들기</button>
          <div class="m-join">
            <input id="menu-code" type="text" maxlength="4" placeholder="코드" autocomplete="off">
            <button id="menu-join" type="button" class="m-btn m-ghost" title="코드로 입장">입장</button>
          </div>
        </div>
      </div>
      <div id="menu-error" class="err"></div>
      <div id="menu-hint" class="hint"></div>
    </div>
  </div>
  <div id="lobby" class="overlay" hidden>
    <div class="box card">
      <div class="hint">방 코드</div>
      <div id="lobby-code"></div>
      <div class="row"><button id="lobby-copy" type="button" class="sub">초대 링크 복사</button></div>
      <div id="lobby-players"></div>
      <div id="lobby-status"></div>
      <div class="hint mob-only">대전 중 다른 앱으로 가거나 화면이 꺼지면 10초 뒤 기권패가 됩니다.</div>
      <div class="row"><button id="lobby-leave" type="button" class="sub">나가기</button></div>
    </div>
  </div>
  <div id="rotate"><div class="card"><div class="icon">📱↻</div>가로로 돌려 주세요</div></div>
  <div id="neterror" class="overlay" hidden>
    <div class="box card">
      <div id="neterror-text" class="err"></div>
      <div class="row"><button id="neterror-back" type="button">첫 화면으로</button></div>
    </div>
  </div>
  <script>
    // 모듈 로드 실패(CDN 차단, WebGL 미지원 등)를 화면에 알린다.
    window.addEventListener('error', (e) => {
      document.getElementById('error').textContent = '오류: ' + (e.message || '스크립트를 불러오지 못했습니다.');
    });
    // 모듈 의존성(Three.js CDN) 로드 실패는 error 이벤트로 잡히지 않으므로 시간 초과로 안내한다.
    setTimeout(() => {
      if (document.getElementById('status').textContent === '불러오는 중…') {
        document.getElementById('error').textContent = '3D 엔진을 불러오지 못했습니다. 새로고침해 주세요.';
      }
    }, 10000);
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
